name: Fix multilingual service buttons

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reorder-service-buttons.yml

permissions:
  contents: write

jobs:
  fix-buttons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix repair/reset detection and styling
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("booking.js")
          text = path.read_text(encoding="utf-8")

          replacements = {
              '/Navigace a software|Navigation und Software|Navigation and software|Opravy vozidel|Fahrzeugreparaturen|Vehicle repairs/i.test(heading.textContent)':
              '/Navigace a software|Navigation und Software|Navigation and software|Opravy vozidel|Fahrzeugreparaturen|Vehicle repairs|Diagnostika a opravy|Diagnose und Reparaturen|Diagnostics and Repairs/i.test(heading.textContent)',

              '/Aktualizace map a systémů|Karten- und Systemaktualisierung|Map and system updates|Opravy a údržba vozidel|Fahrzeugservice und Wartung|Vehicle service and maintenance|Servis a opravy vozidel|Fahrzeugservice und Reparaturen|Vehicle servicing and repairs/i.test(container.textContent)':
              '/Aktualizace map a systémů|Karten- und Systemaktualisierung|Map and system updates|Opravy a údržba vozidel|Reparatur und Wartung von Fahrzeugen|Vehicle Repair and Maintenance|Fahrzeugservice und Wartung|Vehicle service and maintenance|Servis a opravy vozidel|Fahrzeugservice und Reparaturen|Vehicle servicing and repairs/i.test(container.textContent)',

              '/Resetování systémových funkcí|Systemfunktionen zurücksetzen|Reset system functions/i.test(container.textContent)':
              '/Resetování systémových funkcí|Zurücksetzen der Systemfunktionen|Systemfunktionen zurücksetzen|Resetting system functions|Reset system functions/i.test(container.textContent)',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f"Required booking.js pattern is missing: {old}")
              text = text.replace(old, new, 1)

          anchor = '''    if (subtitle) {
      subtitle.textContent = t.serviceSubtitle;
      subtitle.style.fontSize = "14px";
      subtitle.style.color = "#EBDBB1";
      subtitle.style.fontWeight = "400";
      subtitle.style.marginLeft = "64px";
      subtitle.style.marginTop = "8px";
    }

    if (servicePanel?.classList.contains("accordion-panel")) {'''

          replacement = '''    if (subtitle) {
      subtitle.textContent = t.serviceSubtitle;
      subtitle.style.fontSize = "14px";
      subtitle.style.color = "#EBDBB1";
      subtitle.style.fontWeight = "400";
      subtitle.style.marginLeft = "64px";
      subtitle.style.marginTop = "8px";
    }

    // Keep button 1 (repairs) and button 2 (reset) visually identical
    // in Czech, German and English.
    const resetButton = resetContainer.querySelector(".accordion-button");
    const resetCard = resetContainer.querySelector(".service-button");
    const resetTitleRow = resetCard?.querySelector(":scope > div");
    const resetTitle = resetTitleRow?.querySelector("span:last-child");
    const resetIcon = resetTitleRow?.querySelector("img");
    const resetSubtitle = resetCard?.querySelector(":scope > span");

    if (resetButton) {
      resetButton.style.width = "100%";
      resetButton.style.background = "none";
      resetButton.style.border = "none";
      resetButton.style.padding = "0";
    }

    if (resetCard) {
      resetCard.style.display = "flex";
      resetCard.style.flexDirection = "column";
      resetCard.style.alignItems = "flex-start";
      resetCard.style.background = "rgba(0, 0, 0, 0.6)";
      resetCard.style.padding = "16px";
      resetCard.style.borderRadius = "12px";
      resetCard.style.margin = "0 auto 24px auto";
      resetCard.style.maxWidth = "500px";
      resetCard.style.minHeight = "130px";
      resetCard.style.boxShadow = "0 2px 5px rgba(0,0,0,0.15)";
    }

    if (resetTitleRow) {
      resetTitleRow.style.display = "flex";
      resetTitleRow.style.alignItems = "center";
      resetTitleRow.style.gap = "12px";
    }

    if (resetTitle) {
      resetTitle.style.fontSize = "20px";
      resetTitle.style.lineHeight = "1.25";
    }

    if (resetIcon) {
      resetIcon.style.width = "44px";
      resetIcon.style.height = "44px";
      resetIcon.style.objectFit = "contain";
      resetIcon.style.marginLeft = "4px";
      resetIcon.style.marginRight = "4px";
      resetIcon.style.flexShrink = "0";
    }

    if (resetSubtitle) {
      resetSubtitle.style.fontSize = "14px";
      resetSubtitle.style.color = "#EBDBB1";
      resetSubtitle.style.fontWeight = "400";
      resetSubtitle.style.marginLeft = "64px";
      resetSubtitle.style.marginTop = "8px";
    }

    if (servicePanel?.classList.contains("accordion-panel")) {'''

          if anchor not in text:
              raise RuntimeError("Could not find the card styling insertion point in booking.js")
          text = text.replace(anchor, replacement, 1)

          path.write_text(text, encoding="utf-8")
          print("booking.js updated successfully")
          PY

      - name: Commit booking script fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add booking.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix repair and reset buttons in all languages"
            git push
          fi
