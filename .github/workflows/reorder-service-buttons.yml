name: Reorder and unify service buttons

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reorder-service-buttons.yml

permissions:
  contents: write

jobs:
  update-buttons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set repairs first, reset second, and unify styling
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          pages = {
              "index.html": {
                  "repair_marker": "<!-- 🔧 Opravy vozidel -->",
                  "repair_end": "<!-- 🔍 Kontrola vozidla -->",
                  "reset_marker": "<!-- Reset Funkce -->",
                  "repair_title": "Opravy a údržba vozidel",
                  "reset_title": "Resetování systémových funkcí",
              },
              "index.de.html": {
                  "repair_marker": "<!-- 🔧 Fahrzeugreparaturen -->",
                  "repair_end": "<!-- Kontrola Ujetých Kilometrů -->",
                  "reset_marker": "<!-- Reset -->",
                  "repair_title": "Reparatur und Wartung von Fahrzeugen",
                  "reset_title": "Zurücksetzen der Systemfunktionen",
              },
              "index.en.html": {
                  "repair_marker": "<!-- 🔧 Vehicle Repairs -->",
                  "repair_end": "<!-- 🔍 Vehicle Verification -->",
                  "reset_marker": "<!-- 🛠️ Resetting Services -->",
                  "repair_title": "Vehicle Repair and Maintenance",
                  "reset_title": "Resetting system functions",
              },
          }

          for filename, cfg in pages.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")

              start = text.find(cfg["repair_marker"])
              end = text.find(cfg["repair_end"], start)
              reset = text.find(cfg["reset_marker"])
              if min(start, end, reset) < 0:
                  raise RuntimeError(f"{filename}: service markers not found")

              # Keep repairs immediately before reset.
              if start > reset:
                  repair_block = text[start:end].strip() + "\n\n"
                  text = text[:start] + text[end:]
                  reset = text.find(cfg["reset_marker"])
                  text = text[:reset] + repair_block + text[reset:]

              if filename == "index.html":
                  text = re.sub(
                      r'<!-- 🔧 Opravy vozidel -->\s*<h3[^>]*>\s*🔧 Opravy vozidel\s*</h3>',
                      '<!-- Service 1: Repairs -->', text, count=1, flags=re.S
                  )
                  text = text.replace('<!-- Reset Funkce -->', '<!-- Service 2: Reset -->', 1)

              elif filename == "index.de.html":
                  text = re.sub(
                      r'<!-- 🔧 Fahrzeugreparaturen -->\s*<h3[^>]*>\s*🔧 Fahrzeugreparaturen\s*</h3>',
                      '<h3 style="text-align:center; color:#EBDBB1; font-size:20px; margin:50px 0 20px; font-weight:600;">\n  🔧 Diagnose und Reparaturen\n</h3>\n<!-- Service 1: Repairs -->',
                      text, count=1, flags=re.S
                  )
                  text = re.sub(
                      r'<!-- Reset -->\s*<h3[^>]*>\s*🔧 Diagnose-Dienstleistungen\s*</h3>',
                      '<!-- Service 2: Reset -->', text, count=1, flags=re.S
                  )

              else:
                  text = re.sub(
                      r'<!-- 🔧 Vehicle Repairs -->\s*<h3[^>]*>\s*🔧 Vehicle Repairs\s*</h3>',
                      '<h3 style="text-align:center; color:#EBDBB1; font-size:20px; margin:50px 0 20px; font-weight:600;">\n  🔧 Diagnostics and Repairs\n</h3>\n<!-- Service 1: Repairs -->',
                      text, count=1, flags=re.S
                  )
                  text = re.sub(
                      r'<!-- 🛠️ Resetting Services -->\s*<p[^>]*>\s*🔧 Diagnostic Services\s*</p>',
                      '<!-- Service 2: Reset -->', text, count=1, flags=re.S
                  )

              repair_pos = text.find(cfg["repair_title"])
              reset_pos = text.find(cfg["reset_title"])
              if repair_pos < 0 or reset_pos < 0 or repair_pos >= reset_pos:
                  raise RuntimeError(f"{filename}: expected repairs-first/reset-second order is missing")

              path.write_text(text, encoding="utf-8")
              print(f"Updated {filename}")

          css_path = Path("style.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* Unified service-card layout 2026-08-01 */"
          if marker not in css:
              css += f'''\n\n{marker}
.service-container > .accordion-button {{
  width: 100% !important;
  background: none !important;
  border: none !important;
  padding: 0 !important;
}}
.service-container .service-button {{
  display: flex !important;
  flex-direction: column !important;
  align-items: flex-start !important;
  background: rgba(0, 0, 0, 0.6) !important;
  padding: 16px !important;
  border-radius: 12px !important;
  margin: 0 auto 24px auto !important;
  max-width: 500px !important;
  box-shadow: 0 2px 5px rgba(0,0,0,0.15) !important;
  box-sizing: border-box !important;
}}
.service-container .service-button > div {{
  display: flex !important;
  align-items: center !important;
  gap: 12px !important;
  width: 100% !important;
}}
.service-container .service-button > div > img {{
  width: 48px !important;
  height: 48px !important;
  object-fit: contain !important;
  margin: 0 6px !important;
  flex: 0 0 48px !important;
}}
.service-container .service-button > div > span:first-child:not(:last-child) {{
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  width: 60px !important;
  min-width: 60px !important;
}}
.service-container .service-button > div > span:last-child {{
  font-size: 20px !important;
  line-height: 1.25 !important;
  text-align: left !important;
}}
.service-container .service-button > span {{
  font-size: 14px !important;
  line-height: 1.45 !important;
  margin-left: 72px !important;
  margin-top: 8px !important;
  text-align: left !important;
}}
'''
              css_path.write_text(css, encoding="utf-8")
              print("Added unified service-card CSS")
          PY

      - name: Commit website changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index.de.html index.en.html style.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Unify repair and reset buttons across languages"
            git push
          fi
