name: Fix English booking field names

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-english-booking-fields.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Standardize English form field names
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.en.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('name="carBrand"', 'name="carMake"')
          text = text.replace('name="engineSize"', 'name="engine"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.en.html
          git diff --cached --quiet || git commit -m "Fix English booking vehicle fields"
          git push
