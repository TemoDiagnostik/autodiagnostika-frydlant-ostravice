name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove discontinued services and public prices
        run: |
          python <<'PY'
          from pathlib import Path
          import html
          import re

          MAP_TERMS = (
              "aktualizace map a systémů",
              "aktualizace map",
              "navigace a software",
              "karten- und systemaktualisierung",
              "kartenaktualisierung",
              "navigation und software",
              "map and system updates",
              "map updates",
              "navigation and software",
          )

          PRICE_TERMS = (
              "ceník",
              "orientační ceny",
              "preisliste",
              "unverbindliche richtpreise",
              "price list",
              "indicative prices",
          )

          DIV_TOKEN = re.compile(r"(?is)<div\b[^>]*>|</div\s*>")
          SERVICE_OPEN = re.compile(
              r"(?is)<div\b[^>]*class\s*=\s*([\"'])[^\"']*\bservice-container\b[^\"']*\1[^>]*>"
          )
          PANEL_OPEN = re.compile(
              r"(?is)<div\b[^>]*class\s*=\s*([\"'])[^\"']*\baccordion-panel\b[^\"']*\1[^>]*>"
          )
          SIMPLE_BLOCK = re.compile(r"(?is)<(h[1-6]|p)\b[^>]*>.*?</\1\s*>")
          TAGS = re.compile(r"(?is)<[^>]+>")

          def plain_text(fragment):
              return html.unescape(TAGS.sub(" ", fragment)).lower()

          def matching_div_end(text, start):
              depth = 0
              for match in DIV_TOKEN.finditer(text, start):
                  if match.group(0).lower().startswith("<div"):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          return match.end()
              raise RuntimeError("Unclosed div element")

          def skip_space_and_comments(text, pos):
              while True:
                  pos += re.match(r"\s*", text[pos:]).end()
                  if text.startswith("<!--", pos):
                      end = text.find("-->", pos + 4)
                      if end < 0:
                          return pos
                      pos = end + 3
                      continue
                  return pos

          def contains_any(fragment, terms):
              text = plain_text(fragment)
              return any(term in text for term in terms)

          def remove_service_blocks(text, terms):
              removed = 0
              while True:
                  target = None
                  for opening in SERVICE_OPEN.finditer(text):
                      end = matching_div_end(text, opening.start())
                      if contains_any(text[opening.start():end], terms):
                          target = (opening.start(), end)
                          break
                  if target is None:
                      break

                  start, end = target
                  panel_pos = skip_space_and_comments(text, end)
                  panel = PANEL_OPEN.match(text, panel_pos)
                  if panel:
                      end = matching_div_end(text, panel.start())
                  text = text[:start] + text[end:]
                  removed += 1

              text = SIMPLE_BLOCK.sub(
                  lambda match: "" if contains_any(match.group(0), terms) else match.group(0),
                  text,
              )
              return text, removed

          for path in sorted(Path('.').glob('index*.html')):
              original = path.read_text(encoding='utf-8')
              updated, map_removed = remove_service_blocks(original, MAP_TERMS)
              updated, price_removed = remove_service_blocks(updated, PRICE_TERMS)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
              print(f"{path}: removed map={map_removed}, price={price_removed}")

          booking = Path('booking.js')
          if booking.exists():
              text = booking.read_text(encoding='utf-8')
              text = re.sub(r"(?m)^\s*price:\s*[^\n]+\n?", "", text)
              text = re.sub(
                  r"(?s)\n\s*const priceContainer = Array\.from\(document\.querySelectorAll\(\"\.service-container\"\)\)\.find\(\(container\) =>.*?priceList\.appendChild\(item\);\n\s*}\n",
                  "\n",
                  text,
                  count=1,
              )
              booking.write_text(text, encoding='utf-8')

          forbidden = tuple(MAP_TERMS) + tuple(PRICE_TERMS)
          for path in (Path('index.html'), Path('index.de.html'), Path('index.en.html')):
              content = plain_text(path.read_text(encoding='utf-8'))
              remaining = [term for term in forbidden if term in content]
              if remaining:
                  raise RuntimeError(f"{path}: discontinued content remains: {remaining}")
          PY

      - name: Install written WhatsApp contact policy
        run: |
          python <<'PY'
          from pathlib import Path

          script_tag = '<script src="contact-policy.js?v=20260802"></script>'
          for path in sorted(Path('.').glob('index*.html')):
              text = path.read_text(encoding='utf-8')
              if script_tag in text:
                  print(f"{path}: contact policy already installed")
                  continue
              if '</body>' not in text:
                  raise RuntimeError(f"{path}: closing body tag not found")
              text = text.replace('</body>', f'  {script_tag}\n</body>', 1)
              path.write_text(text, encoding='utf-8')
              print(f"{path}: installed written WhatsApp contact policy")
          PY

      - name: Verify contact policy JavaScript
        run: node --check contact-policy.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
