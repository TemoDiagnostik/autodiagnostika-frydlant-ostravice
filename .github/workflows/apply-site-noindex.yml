name: Apply site noindex

on:
  push:
    paths:
      - '.github/workflows/apply-site-noindex.yml'

permissions:
  contents: write

jobs:
  add-noindex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add noindex directives to all HTML pages
        shell: python
        run: |
          from pathlib import Path
          import re

          robots = '<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">'
          googlebot = '<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">'

          changed = []
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              text = re.sub(
                  r'\s*<meta\s+name=["\'](?:robots|googlebot)["\'][^>]*>\s*',
                  '\n',
                  text,
                  flags=re.IGNORECASE,
              )
              if not re.search(r'<head(?:\s[^>]*)?>', text, flags=re.IGNORECASE):
                  print(f'Skipping {path}: no <head> found')
                  continue
              updated = re.sub(
                  r'(<head(?:\s[^>]*)?>)',
                  r'\1\n  ' + robots + '\n  ' + googlebot,
                  text,
                  count=1,
                  flags=re.IGNORECASE,
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated HTML files:')
          for item in changed:
              print(f' - {item}')

      - name: Commit noindex changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes required."
          else
            git commit -m "Prevent auto diagnostics site from appearing in search"
            git push
          fi
