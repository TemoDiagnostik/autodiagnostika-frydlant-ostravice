name: One-time service card cache fix

on:
  push:
    paths:
      - '.github/workflows/one-time-cache-bust.yml'

permissions:
  contents: write

jobs:
  update-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Force browsers to load the corrected script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = "booking.js?v=20260801-1045"
          for filename in ("index.html", "index.de.html", "index.en.html"):
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              import re
              text = re.sub(r'booking\.js(?:\?v=[^"\']+)?', version, text)
              path.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/one-time-cache-bust.yml

      - name: Commit cache-busting update
        shell: bash
        run: |
          git config user.name "Temo Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html index.de.html index.en.html .github/workflows/one-time-cache-bust.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Force corrected service card script to reload"
          git push
