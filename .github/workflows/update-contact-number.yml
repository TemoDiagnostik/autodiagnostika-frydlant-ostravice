name: Update site contact number

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-contact-number.yml

permissions:
  contents: write

jobs:
  update-number:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace contact number everywhere
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          DISPLAY = "+420 730 443 768"
          COMPACT = "420730443768"
          TEL = "+420730443768"

          phone_display = re.compile(r"(?:\+|00)420[\s\u00A0.-]*\d{3}[\s\u00A0.-]*\d{3}[\s\u00A0.-]*\d{3}")
          phone_local = re.compile(r"(?<!\d)\d{3}[\s\u00A0.-]+\d{3}[\s\u00A0.-]+\d{3}(?!\d)")
          wa_link = re.compile(r"https://wa\.me/(?:\+?420)?\d{9}", re.I)
          whatsapp_api = re.compile(r"(https://api\.whatsapp\.com/send\?[^\"'\s>]*?phone=)(?:\+?420)?\d{9}", re.I)
          phone_query = re.compile(r"([?&]phone=)(?:\+?420)?\d{9}", re.I)
          tel_link = re.compile(r"tel:(?:\+|00)?420?[\s\u00A0.-]*\d{3}[\s\u00A0.-]*\d{3}[\s\u00A0.-]*\d{3}", re.I)

          changed = []
          candidates = []

          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html', '.js', '.json', '.txt', '.md'}:
                  continue

              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              for match in phone_display.finditer(original):
                  candidates.append((str(path), match.group(0)))
              for match in wa_link.finditer(original):
                  candidates.append((str(path), match.group(0)))

              updated = original
              updated = wa_link.sub(f"https://wa.me/{COMPACT}", updated)
              updated = whatsapp_api.sub(lambda m: m.group(1) + COMPACT, updated)
              updated = phone_query.sub(lambda m: m.group(1) + COMPACT, updated)
              updated = tel_link.sub(f"tel:{TEL}", updated)
              updated = phone_display.sub(DISPLAY, updated)

              # Replace spaced local Czech mobile numbers only in contact-related files/content.
              if any(token in updated.lower() for token in ('whatsapp', 'telefon', 'phone', 'kontakt', 'contact')):
                  updated = phone_local.sub(DISPLAY, updated)

              if path.suffix.lower() == '.html':
                  updated = re.sub(r'booking\.js(?:\?v=[^\"\']*)?', 'booking.js?v=20260801-7', updated)

              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          booking = Path('booking.js')
          if booking.exists():
              text = booking.read_text(encoding='utf-8')
              marker = '  const applyContactNumber = () => {'
              anchor = '  const findServiceHeading = () =>'
              block = r'''  const applyContactNumber = () => {
    const displayNumber = "+420 730 443 768";
    const compactNumber = "420730443768";

    document.querySelectorAll('a[href^="tel:"]').forEach((link) => {
      link.setAttribute("href", "tel:+420730443768");
      if (/\+?420|\d{3}[\s.-]\d{3}[\s.-]\d{3}/.test(link.textContent || "")) {
        link.textContent = displayNumber;
      }
    });

    document.querySelectorAll('a[href*="wa.me/"], a[href*="api.whatsapp.com"]').forEach((link) => {
      const href = link.getAttribute("href") || "";
      if (href.includes("wa.me/")) {
        link.setAttribute("href", `https://wa.me/${compactNumber}`);
      } else {
        const url = new URL(href, window.location.href);
        url.searchParams.set("phone", compactNumber);
        link.setAttribute("href", url.toString());
      }
    });

    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((node) => {
      node.nodeValue = (node.nodeValue || "").replace(/(?:\+|00)420[\s\u00A0.-]*\d{3}[\s\u00A0.-]*\d{3}[\s\u00A0.-]*\d{3}/g, displayNumber);
    });
  };

'''
              if marker not in text:
                  if anchor not in text:
                      raise RuntimeError('booking.js contact-number insertion point not found')
                  text = text.replace(anchor, block + anchor, 1)
              if 'applyContactNumber();' not in text:
                  call_anchor = '  removeLegacyMapService();'
                  if call_anchor not in text:
                      raise RuntimeError('booking.js contact-number call point not found')
                  text = text.replace(call_anchor, '  applyContactNumber();\n' + call_anchor, 1)
              booking.write_text(text, encoding='utf-8')
              if 'booking.js' not in changed:
                  changed.append('booking.js')

          active = [Path('index.html'), Path('index.de.html'), Path('index.en.html')]
          for path in active:
              content = path.read_text(encoding='utf-8')
              if 'wa.me/' in content and f'wa.me/{COMPACT}' not in content:
                  raise RuntimeError(f'{path}: WhatsApp link was not updated')
              old_czech = [m.group(0) for m in phone_display.finditer(content) if m.group(0) != DISPLAY]
              if old_czech:
                  raise RuntimeError(f'{path}: old Czech phone numbers remain: {old_czech}')

          print('Found previous contact values:')
          for item in sorted(set(candidates)):
              print(' -', item[0], item[1])
          print('Changed files:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit updated number
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Contact number already updated"
          else
            git commit -m "Update contact number across website"
            git push
          fi
